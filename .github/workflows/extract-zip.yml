
name: Extract Wasl ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          mkdir -p extracted-project
          unzip -o "$ZIP_FILE" -d extracted-project

          echo "ZIP extracted successfully."
          find extracted-project -maxdepth 3 -type f | head -n 100

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted-project

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract Wasl project ZIP"
            git push
          fi
